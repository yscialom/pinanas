---
  - name: ensure SSO Authentification installation dir exists
    file:
      path: "/pinanas/dist/jellyfin/config/plugins/SSO Authentication_4.0.0.3"
      state: directory
      mode: 0750
  - name: download SSO Authentification 4.0.0.3
    unarchive:
      src: https://github.com/9p4/jellyfin-plugin-sso/releases/download/v4.0.0.3/sso-authentication_4.0.0.3.zip
      dest: "/pinanas/dist/jellyfin/config/plugins/SSO Authentication_4.0.0.3"
      remote_src: yes
  - name: ensure custom directories exists and are owned by operator
    file:
      path: "/pinanas/dist/jellyfin/data/misc/{{ item }}"
      state: directory
      mode: 0750
    loop:
      - metadata
      - cache
      - databases
